<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - IT Prep Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">🎯 IT Prep Hub</div>
        <div class="nav-links">
            <a href="topics.html">← Back to Topics</a>
        </div>
    </nav>

    <!-- Quiz Container -->
    <div class="quiz-container">

        <!-- Quiz Header -->
        <div class="quiz-header">
            <div class="quiz-progress">
                Question <span id="currentQ">1</span> of <span id="totalQ">10</span>
            </div>
            <div class="quiz-progress">
                ✅ <span id="correctCount">0</span> Correct
            </div>
            <div class="timer" id="timer">⏱️ 30s</div>
        </div>

        <!-- Progress Bar -->
        <div style="background:#1a1a2e; border-radius:10px; height:6px; margin-bottom:25px;">
            <div id="progressBar" style="background:#6c63ff; height:6px; border-radius:10px;
                 width:0%; transition:width 0.3s;"></div>
        </div>

        <!-- Question Box -->
        <div class="question-box">
            <h3 id="questionText">Loading question...</h3>

            <div class="options-grid" id="optionsGrid"></div>

            <!-- Explanation -->
            <div class="explanation-box" id="explanationBox">
                💡 <span id="explanationText"></span>
            </div>
        </div>

        <!-- Next Button -->
        <div style="text-align:right;">
            <button id="nextBtn" onclick="nextQuestion()"
                style="display:none; padding:14px 35px; background:#6c63ff; color:white;
                       border:none; border-radius:8px; font-size:16px; cursor:pointer;">
                Next Question →
            </button>
        </div>

    </div>

    <script>
        let questions = [];
        let currentIndex = 0;
        let score = 0;
        let timerInterval = null;
        let timeLeft = 0;
        let timerSeconds = 0;
        let startTime = Date.now();
        let answered = false;

        // URL se settings lo
        let params = new URLSearchParams(window.location.search);
        let topicId = params.get('topic');
        let limit = params.get('limit') || 10;
        let difficulty = params.get('difficulty') || 'mixed';
        timerSeconds = parseInt(params.get('timer')) || 0;

        window.onload = function() {
            loadQuestions();
        }

        async function loadQuestions() {
            try {
                let url = `https://it-prep-hub-production.up.railway.app/questions/${topicId}?limit=${limit}&difficulty=${difficulty}`;
                let res = await fetch(url);
                let data = await res.json();

                if(data.success && data.questions.length > 0) {
                    questions = data.questions;
                    document.getElementById('totalQ').innerText = questions.length;
                    showQuestion();
                } else {
                    document.getElementById('questionText').innerText =
                        'No questions found for this topic!';
                }
            } catch(err) {
                document.getElementById('questionText').innerText =
                    'Server not running!';
            }
        }

        function showQuestion() {
            answered = false;
            let q = questions[currentIndex];

            // progress update
            document.getElementById('currentQ').innerText = currentIndex + 1;
            let progress = ((currentIndex) / questions.length) * 100;
            document.getElementById('progressBar').style.width = progress + '%';

            // question text
            document.getElementById('questionText').innerText = q.question_text;

            // explanation hide karo
            document.getElementById('explanationBox').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'none';

            // options banao
            let optionsHtml = '';
            q.options.forEach((opt, i) => {
                optionsHtml += `
                    <button class="option-btn" onclick="selectAnswer(this, ${opt.is_correct}, '${q.explanation}')">
                        ${String.fromCharCode(65+i)}. ${opt.option_text}
                    </button>
                `;
            });
            document.getElementById('optionsGrid').innerHTML = optionsHtml;

            // timer start karo
            if(timerSeconds > 0) {
                startTimer();
            } else {
                document.getElementById('timer').innerText = '⏱️ No Timer';
            }
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = timerSeconds;
            updateTimerDisplay();

            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();

                if(timeLeft <= 5) {
                    document.getElementById('timer').classList.add('warning');
                } else {
                    document.getElementById('timer').classList.remove('warning');
                }

                if(timeLeft <= 0) {
                    clearInterval(timerInterval);
                    if(!answered) {
                        timeUp();
                    }
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            document.getElementById('timer').innerText = '⏱️ ' + timeLeft + 's';
        }

        function timeUp() {
            answered = true;
            let btns = document.querySelectorAll('.option-btn');
            btns.forEach(btn => {
                btn.disabled = true;
            });

            let q = questions[currentIndex];
            showExplanation(q.explanation);
            document.getElementById('nextBtn').style.display = 'inline-block';
        }

        function selectAnswer(btn, isCorrect, explanation) {
            if(answered) return;
            answered = true;

            clearInterval(timerInterval);

            let allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.disabled = true);

            if(isCorrect) {
                btn.classList.add('correct');
                score++;
                document.getElementById('correctCount').innerText = score;
            } else {
                btn.classList.add('wrong');
                allBtns.forEach(b => {
                    if(b.onclick.toString().includes('true')) {
                        b.classList.add('correct');
                    }
                });
            }

            showExplanation(explanation);
            document.getElementById('nextBtn').style.display = 'inline-block';
        }

        function showExplanation(text) {
            if(text) {
                document.getElementById('explanationText').innerText = text;
                document.getElementById('explanationBox').style.display = 'block';
            }
        }

        function nextQuestion() {
            currentIndex++;

            if(currentIndex >= questions.length) {
                // quiz khatam
                let totalTime = Math.round((Date.now() - startTime) / 1000);
                let user = JSON.parse(localStorage.getItem('user'));

                // points calculate karo
                let earnedPoints = score * 10 + 20;
                if(score === questions.length) earnedPoints += 50;

                // result save karo
                if(user) {
                    saveResult(user.id, topicId, score, questions.length, totalTime);
                }

                window.location.href = `result.html?score=${score}&total=${questions.length}&time=${totalTime}&topic=${topicId}&points=${earnedPoints}`;

            } else {
                showQuestion();
            }
        }

        async function saveResult(userId, topicId, score, total, time) {
            try {
                await fetch('https://it-prep-hub-production.up.railway.app/results/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: userId,
                        topic_id: topicId,
                        score: score,
                        total_questions: total,
                        time_taken: time
                    })
                });
            } catch(err) {
                console.log('Result save error:', err);
            }
        }
    </script>

</body>
</html>
