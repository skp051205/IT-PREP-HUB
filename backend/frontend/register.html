<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - IT Prep Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">🎯 IT Prep Hub</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="topics.html">Topics</a>
            <a href="leaderboard.html">Leaderboard</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
        </div>
    </nav>

    <!-- Register Form -->
    <div class="auth-container">
        <div class="auth-box">
            <h2>📝 Register Here</h2>

            <div class="msg" id="msg"></div>

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name">
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Create a password">
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm your password">
            </div>

            <button class="btn-submit" onclick="registerUser()">Register</button>

            <div class="auth-link">
                <p>Already have an account? <a href="login.html">Login here</a></p>
            </div>
        </div>
    </div>

    <script>
        async function registerUser() {
            let name = document.getElementById('name').value;
            let email = document.getElementById('email').value;
            let password = document.getElementById('password').value;
            let confirmPassword = document.getElementById('confirmPassword').value;
            let msg = document.getElementById('msg');

            // validation
            if(!name || !email || !password || !confirmPassword) {
                msg.className = 'msg error';
                msg.style.display = 'block';
                msg.innerText = 'Please fill all fields!';
                return;
            }

            if(password !== confirmPassword) {
                msg.className = 'msg error';
                msg.style.display = 'block';
                msg.innerText = 'Passwords do not match!';
                return;
            }

            if(password.length < 6) {
                msg.className = 'msg error';
                msg.style.display = 'block';
                msg.innerText = 'Password must be at least 6 characters!';
                return;
            }

            try {
                let res = await fetch('http://localhost:5000/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });

                let data = await res.json();

                if(data.success) {
                    msg.className = 'msg success';
                    msg.style.display = 'block';
                    msg.innerText = 'Registration successful! Please login.';

                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1500);

                } else {
                    msg.className = 'msg error';
                    msg.style.display = 'block';
                    msg.innerText = data.message;
                }

            } catch(err) {
                msg.className = 'msg error';
                msg.style.display = 'block';
                msg.innerText = 'Server not running!';
            }
        }

        // Enter key
        document.addEventListener('keypress', function(e) {
            if(e.key === 'Enter') registerUser();
        });
    </script>

</body>
</html>
