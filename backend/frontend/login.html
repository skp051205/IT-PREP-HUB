<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - IT Prep Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">🎯 IT Prep Hub</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="topics.html">Topics</a>
            <a href="leaderboard.html">Leaderboard</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
        </div>
    </nav>

    <!-- Login Form -->
    <div class="auth-container">
        <div class="auth-box">
            <h2>🔐 Login</h2>

            <div class="msg" id="msg"></div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password">
            </div>

            <button class="btn-submit" onclick="loginUser()">Login</button>

            <div class="auth-link">
                <p>Don't have an account? <a href="register.html">Register here</a></p>
            </div>
        </div>
    </div>

    <script>
        async function loginUser() {
            let email = document.getElementById('email').value;
            let password = document.getElementById('password').value;
            let msg = document.getElementById('msg');

            // basic validation
            if(!email || !password) {
                msg.className = 'msg error';
                msg.style.display = 'block';
                msg.innerText = 'Please fill all fields!';
                return;
            }

            try {
                let res = await fetch('http://localhost:5000/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                let data = await res.json();

                if(data.success) {
                    // token aur user save karo
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));

                    msg.className = 'msg success';
                    msg.style.display = 'block';
                    msg.innerText = 'Login successful! Redirecting...';

                    // topics page pe jao
                    setTimeout(() => {
                        window.location.href = 'topics.html';
                    }, 1000);

                } else {
                    msg.className = 'msg error';
                    msg.style.display = 'block';
                    msg.innerText = data.message;
                }

            } catch(err) {
                msg.className = 'msg error';
                msg.style.display = 'block';
                msg.innerText = 'Server not running!';
            }
        }

        // Enter key press karo to login
        document.addEventListener('keypress', function(e) {
            if(e.key === 'Enter') loginUser();
        });
    </script>

</body>
</html>
